<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">素简记已完成路线</title>
  <desc id="desc">从 M0 到 M8，再到交付与维护的四阶段已交付路线。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="0.56" stop-color="#eee9dd"/>
      <stop offset="1" stop-color="#e4e0d4"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab4a5"/>
      <stop offset="0.52" stop-color="#c9cbbd"/>
      <stop offset="1" stop-color="#e7e1d5"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63756c"/>
    </marker>
  </defs>

  <rect width="1400" height="420" rx="24" fill="url(#paper)"/>
  <g filter="url(#grain)">
    <path d="M0 339 C135 289 231 355 356 322 C491 287 582 348 725 318 C902 280 1058 356 1400 294 L1400 420 L0 420 Z" fill="#839287" opacity="0.08"/>
    <path d="M0 374 C185 332 338 390 501 354 C671 317 857 386 1035 345 C1160 316 1277 330 1400 319" fill="none" stroke="#7c8f84" stroke-width="1.4" opacity="0.22"/>

    <text x="70" y="66" fill="#263a34" font-family="Georgia, 'Noto Serif SC', serif" font-size="28" letter-spacing="2">已完成路线</text>
    <text x="70" y="94" fill="#718078" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="12" letter-spacing="3">DELIVERED PATH · M0—M8</text>
    <line x1="70" y1="113" x2="1330" y2="113" stroke="#839087" stroke-opacity="0.32"/>

    <g fill="none" stroke="#63756c" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M350 224 H390"/>
      <path d="M670 224 H710"/>
      <path d="M990 224 H1030"/>
    </g>

    <g font-family="Inter, 'Microsoft YaHei', sans-serif">
      <g transform="translate(70 148)">
        <rect width="280" height="152" rx="3" fill="url(#sage)" stroke="#607168" stroke-opacity="0.58"/>
        <text x="24" y="34" fill="#68776f" font-size="11" font-weight="700" letter-spacing="2">FOUNDATION · M0—M2</text>
        <text x="24" y="74" fill="#253630" font-family="Georgia, 'Noto Serif SC', serif" font-size="22">交易基线与所有权</text>
        <text x="24" y="104" fill="#455850" font-size="14">失败恢复 · 边界建立</text>
        <line x1="24" y1="124" x2="256" y2="124" stroke="#66776e" stroke-opacity="0.28"/>
        <text x="24" y="141" fill="#65756d" font-size="10" letter-spacing="1.2">FACTS BEFORE SCALE</text>
      </g>

      <g transform="translate(390 148)">
        <rect width="280" height="152" rx="3" fill="url(#sage)" stroke="#607168" stroke-opacity="0.58"/>
        <text x="24" y="34" fill="#68776f" font-size="11" font-weight="700" letter-spacing="2">OPERATIONS · M3—M5</text>
        <text x="24" y="74" fill="#253630" font-family="Georgia, 'Noto Serif SC', serif" font-size="22">多实例与产品前端</text>
        <text x="24" y="104" fill="#455850" font-size="14">容量基线 · 缓存治理</text>
        <line x1="24" y1="124" x2="256" y2="124" stroke="#66776e" stroke-opacity="0.28"/>
        <text x="24" y="141" fill="#65756d" font-size="10" letter-spacing="1.2">OBSERVABLE UNDER LOAD</text>
      </g>

      <g transform="translate(710 148)">
        <rect width="280" height="152" rx="3" fill="url(#sage)" stroke="#607168" stroke-opacity="0.58"/>
        <text x="24" y="34" fill="#68776f" font-size="11" font-weight="700" letter-spacing="2">SCALE · M6—M8</text>
        <text x="24" y="74" fill="#253630" font-family="Georgia, 'Noto Serif SC', serif" font-size="22">秒杀与数据规模化</text>
        <text x="24" y="104" fill="#455850" font-size="14">协作内容 · 异步收敛</text>
        <line x1="24" y1="124" x2="256" y2="124" stroke="#66776e" stroke-opacity="0.28"/>
        <text x="24" y="141" fill="#65756d" font-size="10" letter-spacing="1.2">BOUNDED DISTRIBUTION</text>
      </g>

      <g transform="translate(1030 148)">
        <rect width="300" height="152" rx="3" fill="#30463e" stroke="#8da093"/>
        <text x="24" y="34" fill="#b9c6be" font-size="11" font-weight="700" letter-spacing="2">DELIVERY · MAINTENANCE</text>
        <text x="24" y="74" fill="#f4efe3" font-family="Georgia, 'Noto Serif SC', serif" font-size="22">浏览器验收与发布</text>
        <text x="24" y="104" fill="#d4ddd7" font-size="14">证据留存 · 边界冻结</text>
        <line x1="24" y1="124" x2="276" y2="124" stroke="#d6ded8" stroke-opacity="0.24"/>
        <text x="24" y="141" fill="#b9c6be" font-size="10" letter-spacing="1.2">MEMORY WITHOUT DRIFT</text>
      </g>
    </g>

    <text x="70" y="354" fill="#586a61" font-family="Georgia, 'Noto Serif SC', serif" font-size="14">读图顺序：先建立交易事实，再扩大运行边界，最后以真实浏览器与发布证据收口。</text>
    <text x="1330" y="354" text-anchor="end" fill="#7a8880" font-family="ui-monospace, Consolas, monospace" font-size="10">completed history · not a future promise</text>
  </g>
</svg>
