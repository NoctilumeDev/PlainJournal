<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc" data-view="ownership-runtime" data-source="docs/visuals/data/system-architecture.data.js">
  <title id="title">素简记服务拓扑</title>
  <desc id="desc">顾客端与管理端经统一网关进入十个事实所有者，并使用独立数据所有权、缓存、消息、注册发现和私有对象存储。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="0.58" stop-color="#eee9dd"/>
      <stop offset="1" stop-color="#e3dfd3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab4a5"/>
      <stop offset="0.54" stop-color="#c8cbbd"/>
      <stop offset="1" stop-color="#e7e1d5"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.66" numOctaves="2" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#63756c"/>
    </marker>
    <style>
      .sans{font-family:Inter,'Microsoft YaHei',sans-serif}.serif{font-family:Georgia,'Noto Serif SC',serif}
      .kicker{font-size:10px;font-weight:700;letter-spacing:2px;fill:#6b7a72}.label{font-size:18px;fill:#263832}.detail{font-size:11px;fill:#586a62}
      .node{fill:url(#card);stroke:#64766c;stroke-opacity:.6}.line{fill:none;stroke:#63756c;stroke-width:1.5}.soft{stroke-opacity:.4}
    </style>
  </defs>

  <rect width="1400" height="980" rx="24" fill="url(#paper)"/>
  <g filter="url(#grain)">
    <path d="M0 870 C215 806 344 917 558 850 C762 786 958 908 1175 833 C1260 803 1333 813 1400 800 L1400 980 L0 980 Z" fill="#809087" opacity="0.07"/>
    <text x="70" y="62" class="serif" fill="#263a34" font-size="30" letter-spacing="2">运行与归属视图</text>
    <text x="70" y="90" class="sans" fill="#718078" font-size="12" letter-spacing="2.4">PRODUCT ENTRIES · FACT OWNERS · DECISION / CONVERGENCE · OWNED SUBSTRATE</text>
    <text x="1330" y="78" text-anchor="end" class="sans" fill="#718078" font-size="11">归属与运行视图 · 非逐线部署图</text>
    <line x1="70" y1="112" x2="1330" y2="112" stroke="#839087" stroke-opacity="0.32"/>

    <!-- product entries -->
    <g class="sans">
      <g transform="translate(250 142)" data-experience-id="storefront-web">
        <rect width="250" height="82" rx="3" class="node"/>
        <text x="20" y="29" class="kicker">PRODUCT ENTRY 01</text>
        <text x="20" y="58" class="label">顾客端 · Storefront</text>
      </g>
      <g transform="translate(900 142)" data-experience-id="admin-web">
        <rect width="250" height="82" rx="3" class="node"/>
        <text x="20" y="29" class="kicker">PRODUCT ENTRY 02</text>
        <text x="20" y="58" class="label">管理端 · Admin</text>
      </g>
      <path d="M375 224 V250 H700" class="line soft"/>
      <path d="M1025 224 V250 H700" class="line soft"/>
      <path d="M700 250 V272" class="line" marker-end="url(#arrow)"/>
      <g transform="translate(490 274)" data-gateway-id="ecommerce-gateway">
        <rect width="420" height="86" rx="3" fill="#31473f" stroke="#879a8f"/>
        <text x="24" y="30" font-size="10" font-weight="700" letter-spacing="2" fill="#b7c5bd">UNIFIED ACCESS BOUNDARY</text>
        <text x="24" y="62" class="serif" font-size="23" fill="#f4efe4">Spring Cloud Gateway · 统一网关</text>
      </g>
    </g>

    <!-- The gateway routes into one explicit owner boundary. The grid has no
         row-to-row edge: all ten cards are peers inside that boundary. -->
    <path d="M700 360 V386" class="line" marker-end="url(#arrow)"/>
    <rect x="42" y="390" width="1316" height="224" rx="5" fill="#f7f3ea" fill-opacity="0.18" stroke="#718178" stroke-opacity="0.3"/>
    <text x="70" y="414" class="sans" fill="#6e7d75" font-size="10" font-weight="700" letter-spacing="2">TEN FACT OWNERS · GATEWAY ROUTES TO EACH OWNER</text>

    <!-- owner services -->
    <g class="sans">
      <g transform="translate(58 432)" data-service-id="identity-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">IDENTITY</text><text x="18" y="55" class="label">身份与账号</text></g>
      <g transform="translate(334 432)" data-service-id="catalog-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">CATALOG</text><text x="18" y="55" class="label">商品目录</text></g>
      <g transform="translate(610 432)" data-service-id="inventory-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">INVENTORY</text><text x="18" y="55" class="label">库存事实</text></g>
      <g transform="translate(886 432)" data-service-id="trade-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">TRADE</text><text x="18" y="55" class="label">交易事实</text></g>
      <g transform="translate(1162 432)" data-service-id="payment-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">PAYMENT</text><text x="18" y="55" class="label">支付事实</text></g>

      <g transform="translate(58 530)" data-service-id="fulfillment-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">FULFILLMENT</text><text x="18" y="55" class="label">履约事实</text></g>
      <g transform="translate(334 530)" data-service-id="marketing-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">MARKETING</text><text x="18" y="55" class="label">营销规则</text></g>
      <g transform="translate(610 530)" data-service-id="chat-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">CHAT</text><text x="18" y="55" class="label">协作会话</text></g>
      <g transform="translate(886 530)" data-service-id="notification-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">NOTIFICATION</text><text x="18" y="55" class="label">通知投递</text></g>
      <g transform="translate(1162 530)" data-service-id="analytics-service"><rect width="180" height="76" rx="3" class="node"/><text x="18" y="28" class="kicker">ANALYTICS</text><text x="18" y="55" class="label">分析投影</text></g>
    </g>

    <!-- Decision and convergence are distinct. Only the three calls declared
         by the governed visual data are classified as synchronous. -->
    <g transform="translate(70 632)" data-sync-edges="Trade->Catalog|Trade->Inventory|Trade->Marketing" data-event-producers="Trade|Inventory|Payment|Fulfillment|Marketing|Chat" data-event-broker="RocketMQ" data-event-consumers="Catalog|Notification|Analytics">
      <rect width="1260" height="92" rx="4" fill="#f7f3ea" fill-opacity="0.48" stroke="#718178" stroke-opacity="0.35"/>
      <line x1="620" y1="16" x2="620" y2="76" stroke="#718178" stroke-opacity="0.25"/>
      <text x="24" y="27" class="sans kicker">BOUNDED SYNCHRONOUS DECISIONS · 立即裁决</text>
      <text x="24" y="56" class="sans" font-size="14" fill="#344840">Trade　→　Catalog · Inventory · Marketing</text>
      <text x="24" y="75" class="sans" font-size="10" fill="#718078">商品与当前价格 · 库存预占与裁决 · 权益计算与锁定</text>
      <text x="646" y="27" class="sans kicker">VERSIONED EVENT CONVERGENCE · 提交后收敛</text>
      <text x="646" y="54" class="sans" font-size="11" fill="#344840">Trade · Inventory · Payment · Fulfillment · Marketing · Chat</text>
      <text x="646" y="74" class="sans" font-size="11" fill="#344840">→ RocketMQ → Catalog · Notification · Analytics</text>
    </g>

    <!-- runtime substrate -->
    <text x="70" y="774" class="sans" fill="#6e7d75" font-size="10" font-weight="700" letter-spacing="2">SELECTED OWNED RUNTIME SUBSTRATE</text>
    <path d="M70 790 H1330" class="line soft"/>
    <g class="sans">
      <g transform="translate(70 812)" data-infrastructure-title="MySQL 8.4"><rect width="230" height="92" rx="3" class="node"/><text x="18" y="28" class="kicker">SOURCE OF RECORD</text><text x="18" y="55" class="label">Owner MySQL schemas</text><text x="18" y="76" class="detail">独立 Schema · 最终事实</text></g>
      <g transform="translate(322 812)" data-infrastructure-title="Redis"><rect width="230" height="92" rx="3" class="node"/><text x="18" y="28" class="kicker">PROJECTION / LEASE</text><text x="18" y="55" class="label">Redis</text><text x="18" y="76" class="detail">缓存 · 准入 · 租约 · 路由</text></g>
      <g transform="translate(574 812)" data-event-broker-card="RocketMQ"><rect width="230" height="92" rx="3" class="node"/><text x="18" y="28" class="kicker">CONVERGENCE</text><text x="18" y="55" class="label">RocketMQ</text><text x="18" y="76" class="detail">版本化事件 · 发布与消费</text></g>
      <g transform="translate(826 812)" data-infrastructure-title="Nacos"><rect width="230" height="92" rx="3" class="node"/><text x="18" y="28" class="kicker">DISCOVERY / CONFIG</text><text x="18" y="55" class="label">Nacos</text><text x="18" y="76" class="detail">服务发现 · 配置</text></g>
      <g transform="translate(1078 812)" data-infrastructure-title="MinIO"><rect width="252" height="92" rx="3" fill="#31473f" stroke="#879a8f"/><text x="18" y="28" font-size="10" font-weight="700" letter-spacing="2" fill="#b7c5bd">OWNED OBJECTS</text><text x="18" y="55" class="serif" font-size="19" fill="#f4efe4">MinIO</text><text x="18" y="76" font-size="11" fill="#d1dbd5">商品媒体 · Chat 私有附件</text></g>
    </g>
    <text x="70" y="944" class="serif" fill="#586a61" font-size="14">每个服务只拥有自己的事实；同步调用只保留立即裁决所需的最小闭环。</text>
    <text x="1330" y="944" text-anchor="end" class="sans" fill="#7a8880" font-size="10">精确逐线关系见工程拓扑图</text>
  </g>
</svg>
