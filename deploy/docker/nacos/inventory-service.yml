ecommerce:
  foundation:
    configuration-source: nacos
  messaging:
    consumer-failure-retry:
      scheduler: inventoryControlScheduler
  security:
    token:
      issuer: ecommerce-identity
  inventory:
    scheduling:
      default-pool-size: 2
      outbox-pool-size: 1
      control-pool-size: 1
      shutdown-await: 10s
    reservation:
      default-ttl: 30m
      expiry-enabled: true
      expiry-scan-delay: 5000
      expiry-batch-size: 100
    outbox:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-inventory-events
      fixed-delay: 500
      retry-delay: 5s
      batch-size: 200
      parallelism: 8
      publisher-id: ${INVENTORY_OUTBOX_PUBLISHER_ID:${random.uuid}}
      lease-duration: ${INVENTORY_OUTBOX_LEASE_DURATION:60s}
      shutdown-await: 10s
    order-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-order-events
      consumer-group: inventory-order-paid-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    return-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-logistics-events
      consumer-group: inventory-return-inspected-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
