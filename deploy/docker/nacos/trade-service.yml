ecommerce:
  foundation:
    configuration-source: nacos
  security:
    token:
      issuer: ecommerce-identity
  trade:
    scheduling:
      default-pool-size: 1
      order-recovery-pool-size: 1
      outbox-pool-size: 1
      flash-sale-pool-size: 2
      shutdown-await: 10s
    client:
      service-discovery-enabled: ${TRADE_SERVICE_DISCOVERY_ENABLED:true}
      connect-timeout: 500ms
      read-timeout: 1500ms
      catalog-base-url: ${TRADE_CATALOG_BASE_URL:http://catalog-service}
      identity-base-url: ${TRADE_IDENTITY_BASE_URL:http://identity-service}
      inventory-base-url: ${TRADE_INVENTORY_BASE_URL:http://inventory-service}
      marketing-base-url: ${TRADE_MARKETING_BASE_URL:http://marketing-service}
      synchronous-boundary:
        total-budget: 5s
        query-max-attempts: 2
        retry-wait: 100ms
        query-max-concurrent-calls: 16
        command-max-concurrent-calls: 8
        bulkhead-max-wait: 250ms
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        open-state-wait: 10s
        half-open-calls: 2
      marketing-pricing-lock:
        connect-timeout: 500ms
        read-timeout: 1500ms
        total-budget: 5s
        max-attempts: 2
        retry-wait: 100ms
        max-concurrent-calls: 8
        bulkhead-max-wait: 250ms
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        open-state-wait: 10s
        half-open-calls: 2
    order:
      default-warehouse-code: PRIMARY
      payment-timeout: 15m
      reservation-grace: 5m
      recovery-enabled: true
      recovery-delay: 5000
      recovery-batch-size: 50
    outbox:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-order-events
      flash-sale-topic: ecommerce-flash-sale-events
      fixed-delay: 2000
      retry-delay: 5s
      batch-size: 50
      parallelism: 8
      publisher-id: ${TRADE_OUTBOX_PUBLISHER_ID:${random.uuid}}
      lease-duration: ${TRADE_OUTBOX_LEASE_DURATION:60s}
    flash-sale-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-flash-sale-events
      consumer-group: trade-flash-sale-admission-v1
      fixed-delay: 200
      batch-size: 32
      invisible-duration: 30s
      await-duration: 5s
      max-attempts: 16
      recovery-delay: 1000
      recovery-batch-size: 100
    payment-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-payment-events
      consumer-group: trade-payment-succeeded-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    fulfillment-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-logistics-events
      consumer-group: trade-fulfillment-events-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    after-sale-fulfillment-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-logistics-events
      consumer-group: trade-after-sale-fulfillment-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    after-sale-inventory-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-inventory-events
      consumer-group: trade-after-sale-inventory-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    refund-result-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-payment-events
      consumer-group: trade-refund-events-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
