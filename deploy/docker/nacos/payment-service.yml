ecommerce:
  foundation:
    configuration-source: nacos
  messaging:
    consumer-failure-retry:
      scheduler: paymentControlScheduler
  security:
    token:
      issuer: ecommerce-identity
  payment:
    scheduling:
      default-pool-size: 1
      outbox-pool-size: 1
      control-pool-size: 2
      shutdown-await: 10s
    client:
      service-discovery-enabled: true
      trade-base-url: http://trade-service
      connect-timeout: 500ms
      read-timeout: 1500ms
      trade-payment-context:
        total-budget: 5s
        max-attempts: 2
        retry-wait: 100ms
        max-concurrent-calls: 8
        bulkhead-max-wait: 250ms
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        open-state-wait: 10s
        half-open-calls: 2
    mock-channel:
      callback-max-skew: 5m
    outbox:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-payment-events
      fixed-delay: 2000
      retry-delay: 5s
      batch-size: 50
      publisher-id: ${PAYMENT_OUTBOX_PUBLISHER_ID:${random.uuid}}
      lease-duration: ${PAYMENT_OUTBOX_LEASE_DURATION:60s}
    refund-consumer:
      enabled: true
      endpoints: 127.0.0.1:18082
      topic: ecommerce-order-events
      consumer-group: payment-refund-requested-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    refund-dispatch:
      enabled: true
      fixed-delay: 2000
      initial-delay: 2000
      retry-delay: 5s
      dispatcher-id: ${PAYMENT_REFUND_DISPATCHER_ID:${random.uuid}}
      claim-timeout: 5m
      batch-size: 50
      max-attempts: 10
