apiVersion: 1

datasources:
  - name: PlainJournal Prometheus
    uid: plainjournal-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: PlainJournal Tempo
    uid: plainjournal-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: plainjournal-prometheus
