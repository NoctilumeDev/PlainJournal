global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: plainjournal-backend
    metrics_path: /actuator/prometheus
    http_headers:
      X-Metrics-Token:
        files:
          - /run/secrets/metrics_scrape_token
    static_configs:
      - targets:
          - host.docker.internal:18103
        labels:
          service: inventory-service
      - targets:
          - host.docker.internal:18104
        labels:
          service: trade-service
      - targets:
          - host.docker.internal:18105
        labels:
          service: payment-service
      - targets:
          - host.docker.internal:18106
        labels:
          service: fulfillment-service
      - targets:
          - host.docker.internal:18107
        labels:
          service: marketing-service
