server:
  port: 0

spring:
  config:
    import: "optional:nacos:"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:identity;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    internal:
      token: test-internal-service-token-with-at-least-32-characters
      allowed-callers:
        - trade-service
    login-attempt:
      namespace: test
      redis-enabled: false
      max-failures: 5
      failure-window: 15m
      lock-duration: 30m
      local-maximum-size: 1000
    token:
      secret: test-only-identity-jwt-secret-with-at-least-32-characters
      issuer: ecommerce-identity-test
      access-ttl: 15m
      refresh-ttl: 7d

logging:
  level:
    root: warn
    com.alibaba.nacos: error
