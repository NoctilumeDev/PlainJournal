server:
  port: 0

spring:
  config:
    import: []
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:inventory;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 40
  flyway:
    enabled: true
    locations: classpath:db/migration

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    token:
      secret: test-only-inventory-jwt-secret-with-at-least-32-characters
      issuer: ecommerce-identity-test
    metrics:
      token: test-only-metrics-scrape-token-with-at-least-32-characters
    internal:
      token: test-trade-internal-token-with-at-least-32-characters
      allowed-callers:
        - trade-service
  inventory:
    scheduling:
      default-pool-size: 2
      outbox-pool-size: 1
      shutdown-await: 5s
    reservation:
      default-ttl: 30m
      expiry-enabled: false
      expiry-scan-delay: 5000
      expiry-batch-size: 100
    outbox:
      enabled: false
      endpoints: 127.0.0.1:18082
      topic: ecommerce-inventory-events
      fixed-delay: 2000
      retry-delay: 5s
      batch-size: 50
      parallelism: 2
      publisher-id: inventory-test
      lease-duration: 30s
      shutdown-await: 5s
    order-consumer:
      enabled: false
    return-consumer:
      enabled: false
    reconciliation:
      enabled: false
      fixed-delay: 10000
      initial-delay: 10000
      scan-limit: 500

logging:
  level:
    root: warn
    com.alibaba.nacos: error

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - consumerfailures
  endpoint:
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only
