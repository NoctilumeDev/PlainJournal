server:
  port: ${INVENTORY_SERVICE_PORT:18103}

spring:
  application:
    name: inventory-service
  config:
    import:
      - optional:nacos:inventory-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${INVENTORY_DB_NAME:ecom_inventory}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${INVENTORY_DB_USER:ecom_inventory_app}
    password: ${INVENTORY_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

ecommerce:
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    internal:
      token: ${INTERNAL_SERVICE_TOKEN:}
      allowed-callers:
        - trade-service
  inventory:
    reservation:
      default-ttl: 30m
      expiry-enabled: true
      expiry-scan-delay: 5000
      expiry-batch-size: 100
    outbox:
      enabled: ${INVENTORY_OUTBOX_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-inventory-events
      fixed-delay: 2000
      retry-delay: 5s
      batch-size: 50
    order-consumer:
      enabled: ${INVENTORY_ORDER_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-order-events
      consumer-group: inventory-order-paid-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    return-consumer:
      enabled: ${INVENTORY_RETURN_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-logistics-events
      consumer-group: inventory-return-inspected-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
