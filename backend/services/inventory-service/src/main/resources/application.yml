server:
  port: ${INVENTORY_SERVICE_PORT:18103}

spring:
  application:
    name: inventory-service
  config:
    import:
      - optional:nacos:inventory-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${INVENTORY_DB_NAME:ecom_inventory}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${INVENTORY_DB_USER:ecom_inventory_app}
    password: ${INVENTORY_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

ecommerce:
  messaging:
    consumer-failure:
      max-delivery-attempts: 16
    consumer-failure-retry:
      scheduler: inventoryControlScheduler
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    metrics:
      token: ${METRICS_SCRAPE_TOKEN:}
    internal:
      token: ${TRADE_INTERNAL_SERVICE_TOKEN:}
      allowed-callers:
        - trade-service
  inventory:
    scheduling:
      default-pool-size: 2
      outbox-pool-size: 1
      control-pool-size: 1
      shutdown-await: 10s
    reservation:
      default-ttl: 30m
      expiry-enabled: true
      expiry-scan-delay: 5000
      expiry-batch-size: 100
    outbox:
      enabled: ${INVENTORY_OUTBOX_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-inventory-events
      fixed-delay: 500
      retry-delay: 5s
      batch-size: 200
      parallelism: 8
      publisher-id: ${INVENTORY_OUTBOX_PUBLISHER_ID:${random.uuid}}
      lease-duration: ${INVENTORY_OUTBOX_LEASE_DURATION:60s}
      shutdown-await: 10s
    order-consumer:
      enabled: ${INVENTORY_ORDER_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-order-events
      consumer-group: inventory-order-paid-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    return-consumer:
      enabled: ${INVENTORY_RETURN_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-logistics-events
      consumer-group: inventory-return-inspected-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    reconciliation:
      enabled: ${INVENTORY_RECONCILIATION_ENABLED:true}
      fixed-delay: 10000
      initial-delay: 10000
      scan-limit: 500

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - consumerfailures
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
