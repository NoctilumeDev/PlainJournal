server:
  port: 0

spring:
  config:
    import: "optional:nacos:"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:fulfillment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    token:
      secret: test-only-fulfillment-jwt-secret-with-at-least-32-characters
      issuer: ecommerce-identity-test
  fulfillment:
    outbox:
      enabled: false
      endpoints: 127.0.0.1:18082
      topic: ecommerce-logistics-events
      fixed-delay: 2000
      retry-delay: 0s
      batch-size: 50
    order-consumer:
      enabled: false
    after-sale-consumer:
      enabled: false

logging:
  level:
    root: warn
    com.alibaba.nacos: error
