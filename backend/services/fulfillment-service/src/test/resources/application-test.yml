server:
  port: 0

spring:
  config:
    import: []
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:fulfillment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    token:
      secret: test-only-fulfillment-jwt-secret-with-at-least-32-characters
      issuer: ecommerce-identity-test
    metrics:
      token: test-only-metrics-scrape-token-with-at-least-32-characters
  fulfillment:
    geo:
      cache-enabled: false
      mysql-spatial-enabled: false
      namespace: test
      max-radius-meters: 2000000
      max-results: 200
      rebuild-limit: 5000
    outbox:
      enabled: false
      endpoints: 127.0.0.1:18082
      topic: ecommerce-logistics-events
      fixed-delay: 2000
      retry-delay: 0s
      batch-size: 50
      publisher-id: fulfillment-test
      lease-duration: 30s
    order-consumer:
      enabled: false
    after-sale-consumer:
      enabled: false

logging:
  level:
    root: warn
    com.alibaba.nacos: error

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - consumerfailures
  endpoint:
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only
