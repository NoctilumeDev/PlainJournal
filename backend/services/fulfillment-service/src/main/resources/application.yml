server:
  port: ${FULFILLMENT_SERVICE_PORT:18106}

spring:
  application:
    name: fulfillment-service
  config:
    import:
      - optional:nacos:fulfillment-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${FULFILLMENT_DB_NAME:ecom_fulfillment}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${FULFILLMENT_DB_USER:ecom_fulfillment_app}
    password: ${FULFILLMENT_DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ecommerce:
  foundation:
    configuration-source: local-default
  messaging:
    consumer-failure:
      max-delivery-attempts: 16
    consumer-failure-retry:
      scheduler: fulfillmentControlScheduler
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    metrics:
      token: ${METRICS_SCRAPE_TOKEN:}
  fulfillment:
    scheduling:
      default-pool-size: 2
      outbox-pool-size: 1
      control-pool-size: 1
      shutdown-await: 10s
    geo:
      cache-enabled: ${FULFILLMENT_GEO_CACHE_ENABLED:true}
      mysql-spatial-enabled: ${FULFILLMENT_GEO_MYSQL_SPATIAL_ENABLED:true}
      namespace: ${FULFILLMENT_GEO_NAMESPACE:local}
      max-radius-meters: 2000000
      max-results: 200
      rebuild-limit: 5000
    outbox:
      enabled: ${FULFILLMENT_OUTBOX_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-logistics-events
      fixed-delay: 2000
      retry-delay: 5s
      batch-size: 50
      publisher-id: ${FULFILLMENT_OUTBOX_PUBLISHER_ID:${random.uuid}}
      lease-duration: ${FULFILLMENT_OUTBOX_LEASE_DURATION:60s}
    order-consumer:
      enabled: ${FULFILLMENT_ORDER_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-order-events
      consumer-group: fulfillment-order-paid-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    after-sale-consumer:
      enabled: ${FULFILLMENT_AFTER_SALE_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-order-events
      consumer-group: fulfillment-after-sale-approved-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    reconciliation:
      enabled: ${FULFILLMENT_RECONCILIATION_ENABLED:true}
      fixed-delay: 10000
      initial-delay: 10000
      scan-limit: 500

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - consumerfailures
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
