server:
  port: ${CATALOG_SERVICE_PORT:18102}

spring:
  application:
    name: catalog-service
  config:
    import:
      - optional:nacos:catalog-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${CATALOG_DB_NAME:ecom_catalog}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${CATALOG_DB_USER:ecom_catalog_app}
    password: ${CATALOG_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 300ms
      timeout: 300ms
      lettuce:
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

ecommerce:
  foundation:
    configuration-source: local-default
  messaging:
    consumer-failure:
      max-delivery-attempts: ${CATALOG_CONSUMER_FAILURE_MAX_DELIVERY_ATTEMPTS:16}
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    metrics:
      token: ${METRICS_SCRAPE_TOKEN:}
  catalog:
    search:
      enabled: ${CATALOG_SEARCH_ENABLED:false}
      endpoint: ${CATALOG_SEARCH_ENDPOINT:http://127.0.0.1:19200}
      index-alias: ${CATALOG_SEARCH_INDEX_ALIAS:plainjournal-products-local}
      connect-timeout: ${CATALOG_SEARCH_CONNECT_TIMEOUT:500ms}
      request-timeout: ${CATALOG_SEARCH_REQUEST_TIMEOUT:2s}
      batch-size: ${CATALOG_SEARCH_BATCH_SIZE:20}
      max-attempts: ${CATALOG_SEARCH_MAX_ATTEMPTS:5}
      retry-delay: ${CATALOG_SEARCH_RETRY_DELAY:2s}
      lease-duration: ${CATALOG_SEARCH_LEASE_DURATION:30s}
      worker-id: ${CATALOG_SEARCH_WORKER_ID:${SERVICE_INSTANCE_ID:catalog-search-local}}
      rebuild-batch-size: ${CATALOG_SEARCH_REBUILD_BATCH_SIZE:200}
      reconciliation-limit: ${CATALOG_SEARCH_RECONCILIATION_LIMIT:20000}
      mysql-fallback-enabled: ${CATALOG_SEARCH_MYSQL_FALLBACK_ENABLED:true}
      reconciliation-enabled: ${CATALOG_SEARCH_RECONCILIATION_ENABLED:true}
      reconciliation-initial-delay: ${CATALOG_SEARCH_RECONCILIATION_INITIAL_DELAY:30s}
      reconciliation-fixed-delay: ${CATALOG_SEARCH_RECONCILIATION_FIXED_DELAY:5m}
      projection-initial-delay: ${CATALOG_SEARCH_PROJECTION_INITIAL_DELAY:1000}
      projection-fixed-delay: ${CATALOG_SEARCH_PROJECTION_FIXED_DELAY:1000}
      rebuild-initial-delay: ${CATALOG_SEARCH_REBUILD_INITIAL_DELAY:1000}
      rebuild-fixed-delay: ${CATALOG_SEARCH_REBUILD_FIXED_DELAY:1000}
    review-events:
      enabled: ${CATALOG_REVIEW_EVENTS_ENABLED:true}
      endpoints: ${ROCKETMQ_ENDPOINTS:127.0.0.1:18082}
      consumer-group: ${CATALOG_REVIEW_CONSUMER_GROUP:ecommerce-catalog-order-completed-reviews}
      topic: ${CATALOG_REVIEW_ORDER_TOPIC:ecommerce-order-events}
      initial-delay: ${CATALOG_REVIEW_EVENTS_INITIAL_DELAY:2000}
      fixed-delay: ${CATALOG_REVIEW_EVENTS_FIXED_DELAY:500}
      await-duration: ${CATALOG_REVIEW_EVENTS_AWAIT_DURATION:5s}
      invisible-duration: ${CATALOG_REVIEW_EVENTS_INVISIBLE_DURATION:20s}
      batch-size: ${CATALOG_REVIEW_EVENTS_BATCH_SIZE:20}
    read-replica:
      enabled: ${CATALOG_READ_REPLICA_ENABLED:false}
      fallback-to-primary: ${CATALOG_READ_REPLICA_FALLBACK_TO_PRIMARY:true}
      datasource:
        url: jdbc:mysql://${CATALOG_REPLICA_HOST:127.0.0.1}:${CATALOG_REPLICA_PORT:13316}/${CATALOG_REPLICA_DB_NAME:ecom_catalog}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
        username: ${CATALOG_REPLICA_DB_USER:ecom_catalog_app}
        password: ${CATALOG_REPLICA_DB_PASSWORD:}
        hikari:
          connection-timeout: 750
          validation-timeout: 500
          initialization-fail-timeout: -1
          maximum-pool-size: 6
          minimum-idle: 0
    cache:
      enabled: ${CATALOG_CACHE_ENABLED:true}
      namespace: ${APP_ENV:local}
      local-maximum-size: 10000
      local-ttl: 2m
      fresh-ttl: 4m
      stale-ttl: 8m
      negative-ttl: 30s
      ttl-jitter: 0.15
      rebuild-wait: 100ms
      rebuild-max-concurrent: 16
      refresh-threads: 4
      refresh-queue-capacity: 100
      distributed-lock-ttl: 5s
      invalidation-channel: ecommerce:${APP_ENV:local}:catalog:product-detail:invalidate
    media:
      endpoint: http://${MINIO_HOST:127.0.0.1}:${MINIO_API_PORT:19000}
      username: ${MINIO_ROOT_USER:}
      password: ${MINIO_ROOT_PASSWORD:}
      bucket: product-media
      upload-expiry: 15m
      download-expiry: 15m
      maximum-size: 10MB

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,consumerfailures
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
