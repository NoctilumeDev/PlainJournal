server:
  port: 0

spring:
  config:
    import: []
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:catalog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    token:
      secret: test-only-catalog-jwt-secret-with-at-least-32-characters
      issuer: ecommerce-identity-test
    metrics:
      token: test-only-metrics-token-with-at-least-32-characters
  catalog:
    search:
      enabled: false
      endpoint: http://127.0.0.1:19200
      index-alias: plainjournal-products-test
      connect-timeout: 100ms
      request-timeout: 100ms
      batch-size: 10
      max-attempts: 3
      retry-delay: 10ms
      lease-duration: 5s
      worker-id: catalog-search-test
      rebuild-batch-size: 20
      reconciliation-limit: 100
      mysql-fallback-enabled: true
      reconciliation-enabled: false
      reconciliation-initial-delay: 1h
      reconciliation-fixed-delay: 1h
    review-events:
      enabled: false
    read-replica:
      enabled: false
      fallback-to-primary: true
    cache:
      enabled: false
      namespace: test
      local-maximum-size: 100
      local-ttl: 1m
      fresh-ttl: 1m
      stale-ttl: 1m
      negative-ttl: 10s
      ttl-jitter: 0
      rebuild-wait: 100ms
      rebuild-max-concurrent: 4
      refresh-threads: 1
      refresh-queue-capacity: 10
      distributed-lock-ttl: 1s
      invalidation-channel: ecommerce:test:catalog:product-detail:invalidate
    media:
      endpoint: http://127.0.0.1:19000
      username: test-user
      password: test-password
      bucket: product-media
      upload-expiry: 15m
      download-expiry: 15m
      maximum-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,consumerfailures
  endpoint:
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only

logging:
  level:
    root: warn
    com.alibaba.nacos: error
