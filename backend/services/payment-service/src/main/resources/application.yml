server:
  port: ${PAYMENT_SERVICE_PORT:18105}

spring:
  application:
    name: payment-service
  config:
    import:
      - optional:nacos:payment-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${PAYMENT_DB_NAME:ecom_payment}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PAYMENT_DB_USER:ecom_payment_app}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

ecommerce:
  messaging:
    consumer-failure:
      max-delivery-attempts: 16
    consumer-failure-retry:
      scheduler: paymentControlScheduler
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    metrics:
      token: ${METRICS_SCRAPE_TOKEN:}
  clients:
    internal:
      token: ${PAYMENT_INTERNAL_SERVICE_TOKEN:}
      caller: payment-service
  payment:
    scheduling:
      default-pool-size: 1
      outbox-pool-size: 1
      control-pool-size: 2
      shutdown-await: 10s
    client:
      service-discovery-enabled: true
      trade-base-url: http://trade-service
      connect-timeout: 500ms
      read-timeout: 1500ms
      trade-payment-context:
        total-budget: 5s
        max-attempts: 2
        retry-wait: 100ms
        max-concurrent-calls: 8
        bulkhead-max-wait: 250ms
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        open-state-wait: 10s
        half-open-calls: 2
    mock-channel:
      callback-secret: ${MOCK_PAYMENT_CALLBACK_SECRET:}
      callback-max-skew: 5m
    outbox:
      enabled: ${PAYMENT_OUTBOX_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-payment-events
      fixed-delay: 2000
      retry-delay: 5s
      batch-size: 50
      publisher-id: ${PAYMENT_OUTBOX_PUBLISHER_ID:${random.uuid}}
      lease-duration: ${PAYMENT_OUTBOX_LEASE_DURATION:60s}
    refund-consumer:
      enabled: ${PAYMENT_REFUND_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-order-events
      consumer-group: payment-refund-requested-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s
    refund-dispatch:
      enabled: ${PAYMENT_REFUND_DISPATCH_ENABLED:true}
      fixed-delay: 2000
      initial-delay: 2000
      retry-delay: 5s
      dispatcher-id: ${PAYMENT_REFUND_DISPATCHER_ID:${random.uuid}}
      claim-timeout: 5m
      batch-size: 50
      max-attempts: 10
    reconciliation:
      enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
      fixed-delay: 10000
      initial-delay: 10000
      scan-limit: 500

management:
  tracing:
    enabled: true
    baggage:
      enabled: false
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
  otlp:
    tracing:
      export:
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTLP_TRACING_ENDPOINT:http://127.0.0.1:14318/v1/traces}
      transport: http
      connect-timeout: 1s
      timeout: 3s
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - consumerfailures
          - businessprocesses
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only
    businessprocesses:
      access: read-only

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
