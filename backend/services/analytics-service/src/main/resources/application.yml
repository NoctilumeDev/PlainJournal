server:
  port: ${ANALYTICS_SERVICE_PORT:18110}
  shutdown: ${SERVER_SHUTDOWN:graceful}

spring:
  application:
    name: analytics-service
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}
  config:
    import:
      - optional:nacos:analytics-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
        metadata:
          instance-id: ${SERVICE_INSTANCE_ID:local}
          release-id: ${SERVICE_RELEASE_ID:local}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${ANALYTICS_DB_NAME:ecom_analytics}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${ANALYTICS_DB_USER:ecom_analytics_app}
    password: ${ANALYTICS_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 8
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

ecommerce:
  foundation:
    configuration-source: local-default
  messaging:
    consumer-failure:
      max-delivery-attempts: ${ANALYTICS_CONSUMER_FAILURE_MAX_DELIVERY_ATTEMPTS:16}
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    metrics:
      token: ${METRICS_SCRAPE_TOKEN:}
  analytics:
    zone-id: ${ANALYTICS_ZONE_ID:Asia/Shanghai}
    maximum-range-days: ${ANALYTICS_MAXIMUM_RANGE_DAYS:366}
    reconciliation-row-limit: ${ANALYTICS_RECONCILIATION_ROW_LIMIT:10000}
    events:
      enabled: ${ANALYTICS_EVENTS_ENABLED:true}
      endpoints: ${ROCKETMQ_ENDPOINTS:127.0.0.1:18082}
      consumer-group: ${ANALYTICS_CONSUMER_GROUP:ecommerce-analytics-domain-events}
      trade-topic: ${ANALYTICS_TRADE_TOPIC:ecommerce-order-events}
      payment-topic: ${ANALYTICS_PAYMENT_TOPIC:ecommerce-payment-events}
      initial-delay: ${ANALYTICS_EVENTS_INITIAL_DELAY:2000}
      fixed-delay: ${ANALYTICS_EVENTS_FIXED_DELAY:500}
      await-duration: ${ANALYTICS_EVENTS_AWAIT_DURATION:5s}
      invisible-duration: ${ANALYTICS_EVENTS_INVISIBLE_DURATION:20s}
      batch-size: ${ANALYTICS_EVENTS_BATCH_SIZE:20}

management:
  tracing:
    enabled: true
    baggage:
      enabled: false
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
  otlp:
    tracing:
      export:
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTLP_TRACING_ENDPOINT:http://127.0.0.1:14318/v1/traces}
      transport: http
      connect-timeout: 1s
      timeout: 3s
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,consumerfailures
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    metrics:
      access: read-only
    prometheus:
      access: read-only
    consumerfailures:
      access: read-only

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
