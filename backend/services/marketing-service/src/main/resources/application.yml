server:
  port: ${MARKETING_SERVICE_PORT:18107}

spring:
  application:
    name: marketing-service
  config:
    import:
      - optional:nacos:marketing-service.yml?group=ECOMMERCE&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_CLIENT_PORT:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_ADMIN_PASSWORD:}
      discovery:
        group: ECOMMERCE
        ip: ${SERVICE_IP:127.0.0.1}
      config:
        group: ECOMMERCE
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MARKETING_DB_NAME:ecom_marketing}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MARKETING_DB_USER:ecom_marketing_app}
    password: ${MARKETING_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    token:
      secret: ${IDENTITY_JWT_SECRET:}
      issuer: ecommerce-identity
    internal:
      token: ${INTERNAL_SERVICE_TOKEN:}
      allowed-callers:
        - trade-service
  marketing:
    order-consumer:
      enabled: ${MARKETING_ORDER_CONSUMER_ENABLED:true}
      endpoints: ${ROCKETMQ_PROXY_ENDPOINT:127.0.0.1:18082}
      topic: ecommerce-order-events
      consumer-group: marketing-order-lifecycle-v1
      fixed-delay: 1000
      batch-size: 16
      invisible-duration: 30s
      await-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    com.alibaba.nacos: warn
