server:
  port: 0

spring:
  config:
    import: "optional:nacos:"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:marketing;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

ecommerce:
  foundation:
    configuration-source: local-default
  security:
    token:
      secret: test-only-marketing-jwt-secret-with-at-least-32-characters
      issuer: ecommerce-identity-test
    internal:
      token: test-internal-service-token-with-at-least-32-characters
      allowed-callers:
        - trade-service
  marketing:
    order-consumer:
      enabled: false
      endpoints: 127.0.0.1:18082
      topic: ecommerce-order-events
      consumer-group: marketing-order-lifecycle-v1
      batch-size: 16

logging:
  level:
    root: warn
    com.alibaba.nacos: error
