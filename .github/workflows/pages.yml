name: Online Preview

on:
  push:
    branches: [main]
    paths:
      - "online-preview/**"
      - "docs/assets/v7-4/**"
      - "tools/build-online-preview.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build static preview
        run: node tools/build-online-preview.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
