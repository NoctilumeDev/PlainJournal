name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.3
      - name: Verify generated documents and architecture
        run: |
          node tools/run-repository-tests.mjs
          node tools/check-backend-boundaries.mjs
          node tools/check-visual-docs.mjs
          node tools/check-documentation-structure.mjs
          node tools/check-residual-hygiene.mjs
          node tools/check-markdown-links.mjs
          node tools/check-frontend-page-registry.mjs
          node tools/check-frontend-baseline.mjs
          node tools/check-release-version.mjs
          node tools/render-verification-summary.mjs --check
      - name: Parse Compose configurations
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          pwsh -NoLogo -NoProfile -File deploy/docker/bootstrap-resources.ps1 -PrepareEnvironmentOnly
          docker compose --file deploy/docker/compose.yml --env-file deploy/docker/.env --profile core config --quiet
          docker compose --file frontend/deploy/nginx/compose.yml config --quiet
      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" \
              && "${{ github.ref_type }}" == "branch" \
              && -n "$PUSH_BEFORE_SHA" \
              && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA...$PUSH_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25.0.5"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.3
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -Dcatalog.redis.test.port=6379 clean verify
      - name: Enforce aggregate backend coverage
        run: node tools/check-backend-coverage.mjs
      - name: Run PMD
        working-directory: backend
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -DskipTests install
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run frontend gates
        working-directory: frontend
        run: pnpm check
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/.run/*.log
          if-no-files-found: ignore
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  combined_commerce:
    name: Combined commerce pressure and four-ledger witness
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'qualification/plainjournal-combined-53ecf62'
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    permissions:
      contents: read
    env:
      PRODUCT_SHA: 53ecf628741e2df3ab43e5f744d1dbabf4131883
      BASELINE_SHA: 3e96b8d7c8dd0df3b94a64c068c6cc1e823a43f3
      PYTHONDONTWRITEBYTECODE: '1'
      MAVEN_OPTS: -Xmx1024m
      PJ_MYSQL_REF: mysql@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
      PJ_JRE_REF: eclipse-temurin@sha256:e1898fd6a11fc965a994d8ace186fd3585aeb636cf8f05f47a723fcfee0b0918
      PJ_ROCKETMQ_REF: apache/rocketmq@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
      PJ_NODE_REF: node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
      PJ_REDIS_REF: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      PJ_SOURCE: ${{ github.workspace }}/product
    steps:
      - name: Check out the pressure witness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: witness
          persist-credentials: false
      - name: Check out the fixed product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 53ecf628741e2df3ab43e5f744d1dbabf4131883
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.3
      - name: Package fixed SHA JARs and acquire pinned fixtures
        run: |
          test "$(git -C "$PJ_SOURCE" rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -C "$PJ_SOURCE" status --porcelain)"
          export PJ_WITNESS_INPUTS="$RUNNER_TEMP/pj-pressure-inputs"
          echo "PJ_WITNESS_INPUTS=$PJ_WITNESS_INPUTS" >> "$GITHUB_ENV"
          mkdir -p "$PJ_WITNESS_INPUTS"
          (
            cd "$PJ_SOURCE/backend"
            ./mvnw --version | tee "$PJ_WITNESS_INPUTS/toolchain.txt"
            grep -F 'Java version: 25.0.5' "$PJ_WITNESS_INPUTS/toolchain.txt"
            grep -F 'Apache Maven 3.9.16' "$PJ_WITNESS_INPUTS/toolchain.txt"
            ./mvnw --batch-mode --no-transfer-progress -pl ecommerce-gateway,services/trade-service,services/payment-service,services/inventory-service,services/identity-service,services/catalog-service,services/marketing-service,services/fulfillment-service -am -DskipTests clean package
          )
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          folder = Path(os.environ["PJ_WITNESS_INPUTS"])
          product = Path(os.environ["PJ_SOURCE"])
          services = ("trade", "payment", "inventory", "identity", "catalog", "marketing", "fulfillment")
          paths = [f"backend/services/{name}-service/target/{name}-service.jar" for name in services]
          paths.append("backend/ecommerce-gateway/target/ecommerce-gateway.jar")

          def package_hashes(root, jar_paths):
              hashes = {}
              for path in jar_paths:
                  data = (root / path).read_bytes()
                  hashes[path] = hashlib.sha256(data).hexdigest()
                  with ZipFile(root / path) as jar:
                      classes = [item for item in jar.namelist()
                                 if item.startswith("BOOT-INF/classes/") and item.endswith(".class")]
                      assert classes and all(int.from_bytes(jar.read(item)[6:8], "big")==61 for item in classes)
                      assert "BOOT-INF/lib/spring-boot-4.1.2.jar" in jar.namelist()
              return hashes

          records = {
              "candidate-jars": package_hashes(product, paths),
              "coordinates": {"candidate": os.environ["PRODUCT_SHA"], "baseline": os.environ["BASELINE_SHA"]},
          }
          for name, content in records.items():
              (folder/f"{name}.json").write_text(json.dumps(content,indent=2)+"\n",encoding="utf-8")
          PY
          for image in "$PJ_MYSQL_REF" "$PJ_JRE_REF" "$PJ_ROCKETMQ_REF" "$PJ_NODE_REF" "$PJ_REDIS_REF"; do
            docker pull --platform linux/amd64 "$image"
          done
      - name: Build customer and admin previews and install Chromium
        working-directory: product/frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = v24.22.3
          test "$(pnpm --version)" = 11.9.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
          find storefront-web/dist admin-web/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$PJ_WITNESS_INPUTS/frontend-assets.txt"
      - name: Same order across disconnect, midnight, cancellation, refund and reordering
        run: |
          scripts="$GITHUB_WORKSPACE/witness/.github/witness/pressure"
          export PJ_REPRICING_SCRIPT="$scripts/verify-p1-03-04-repricing-and-sampling.py"
          export PJ_BROWSER_LAB_SCRIPT="$scripts/run-built-browser-clock-lab.py"
          output="$RUNNER_TEMP/pj-pressure/combined"
          python3 -B "$scripts/run-combined-commerce-lab.py" --evidence "$output" --node "$(command -v node)" --hold-seconds 480 &
          lab=$!
          on_exit() {
            if kill -0 "$lab" 2>/dev/null; then
              if test -d "$output" && ! test -e "$output/combination-browser-failure.json"; then
                printf '{"source":"%s","reason":"runner-exited"}\n' "$PRODUCT_SHA" > "$output/combination-browser-failure.json"
              fi
              wait "$lab" || true
            fi
          }
          trap on_exit EXIT
          for i in $(seq 1 120); do
            test ! -e "$output/workspace.json" || break
            kill -0 "$lab" 2>/dev/null || break
            sleep 2
          done
          test -s "$output/workspace.json"
          node "$scripts/verify-combined-browser-commerce.mjs" "$output"
          wait "$lab"
      - name: Retain scoped outcomes and business ledgers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: commerce-combined-pressure-53ecf62
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pj-pressure-inputs/*.json
            ${{ runner.temp }}/pj-pressure-inputs/toolchain.txt
            ${{ runner.temp }}/pj-pressure-inputs/frontend-assets.txt
            ${{ runner.temp }}/pj-pressure/**/*.json
            !${{ runner.temp }}/pj-pressure/**/*-stopped.json
