name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.3
      - name: Verify generated documents and architecture
        run: |
          node tools/run-repository-tests.mjs
          node tools/check-backend-boundaries.mjs
          node tools/check-visual-docs.mjs
          node tools/check-documentation-structure.mjs
          node tools/check-residual-hygiene.mjs
          node tools/check-markdown-links.mjs
          node tools/check-frontend-page-registry.mjs
          node tools/check-frontend-baseline.mjs
          node tools/check-release-version.mjs
          node tools/render-verification-summary.mjs --check
      - name: Parse Compose configurations
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          pwsh -NoLogo -NoProfile -File deploy/docker/bootstrap-resources.ps1 -PrepareEnvironmentOnly
          docker compose --file deploy/docker/compose.yml --env-file deploy/docker/.env --profile core config --quiet
          docker compose --file frontend/deploy/nginx/compose.yml config --quiet
      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" \
              && "${{ github.ref_type }}" == "branch" \
              && -n "$PUSH_BEFORE_SHA" \
              && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA...$PUSH_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25.0.5"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.3
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -Dcatalog.redis.test.port=6379 clean verify
      - name: Enforce aggregate backend coverage
        run: node tools/check-backend-coverage.mjs
      - name: Run PMD
        working-directory: backend
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -DskipTests install
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run frontend gates
        working-directory: frontend
        run: pnpm check
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/.run/*.log
          if-no-files-found: ignore
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  boot412_runtime_witness:
    name: Boot 4 authenticated Nacos and messaging runtime witness
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'qualification/plainjournal-boot412-linux-0c4fd7c'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    env:
      PRODUCT_SHA: 0c4fd7c73588bb95a6f8ecbb2debe0993e780b58
      PYTHONDONTWRITEBYTECODE: '1'
      MAVEN_OPTS: -Xmx1024m
      PJ_MYSQL_REF: mysql@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
      PJ_NACOS_REF: nacos/nacos-server@sha256:d6b3087bc2302c2b49c875e1c5ad8c916fc10696ceb355be56cffd715e178d81
      PJ_JRE_REF: eclipse-temurin@sha256:e1898fd6a11fc965a994d8ace186fd3585aeb636cf8f05f47a723fcfee0b0918
      PJ_ROCKETMQ_REF: apache/rocketmq@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
      PJ_NODE_REF: node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    steps:
      - name: Check out witness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: witness
          persist-credentials: false
      - name: Check out exact framework candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c4fd7c73588bb95a6f8ecbb2debe0993e780b58
          path: product
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.5'
      - name: Package and bind Gateway, Trade, Payment and Inventory
        working-directory: product/backend
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/pj-inputs"
          ./mvnw --version | tee "$RUNNER_TEMP/pj-inputs/toolchain.txt"
          grep -F 'Java version: 25.0.5' "$RUNNER_TEMP/pj-inputs/toolchain.txt"
          grep -F 'Apache Maven 3.9.16' "$RUNNER_TEMP/pj-inputs/toolchain.txt"
          ./mvnw --batch-mode --no-transfer-progress -pl ecommerce-gateway,services/trade-service,services/payment-service,services/inventory-service -am -DskipTests clean package
          python3 -I - "$RUNNER_TEMP/pj-inputs" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import os
          import sys

          jars = (
              "backend/ecommerce-gateway/target/ecommerce-gateway.jar",
              "backend/services/trade-service/target/trade-service.jar",
              "backend/services/payment-service/target/payment-service.jar",
              "backend/services/inventory-service/target/inventory-service.jar",
          )
          inputs = Path(sys.argv[1])
          hashes = {}
          for name in jars:
              jar = Path("..") / name
              hashes[name] = hashlib.sha256(jar.read_bytes()).hexdigest()
              with ZipFile(jar) as package:
                  product_classes = [item for item in package.namelist()
                                     if item.startswith("BOOT-INF/classes/") and item.endswith(".class")]
                  assert product_classes and all(int.from_bytes(package.read(item)[6:8], "big")==61 for item in product_classes)
                  assert "BOOT-INF/lib/spring-boot-4.1.2.jar" in package.namelist()
          (inputs/"candidate-jars.json").write_text(json.dumps(hashes, indent=2) + "\n")
          (inputs/"coordinates.json").write_text(json.dumps({"candidate":os.environ["PRODUCT_SHA"]}) + "\n")
          PY
      - name: Load pinned fixture images and build runtime containers
        working-directory: product/backend
        run: |
          for image in "$PJ_MYSQL_REF" "$PJ_NACOS_REF" "$PJ_JRE_REF" "$PJ_ROCKETMQ_REF" "$PJ_NODE_REF"; do
            docker pull --platform linux/amd64 "$image"
          done
          inputs="$RUNNER_TEMP/pj-inputs"
          docker build --label "org.opencontainers.image.revision=$PRODUCT_SHA" -f ecommerce-gateway/Dockerfile -t pj-boot412-gateway:witness .
          docker build --label "org.opencontainers.image.revision=$PRODUCT_SHA" -f services/trade-service/Dockerfile -t pj-boot412-trade:witness .
          docker image inspect --format '{{.Id}}' pj-boot412-gateway:witness > "$inputs/boot412-gateway-image-id.txt"
          docker image inspect --format '{{.Id}}' pj-boot412-trade:witness > "$inputs/boot412-trade-image-id.txt"
      - name: Verify authenticated configuration and Gateway discovery
        run: |
          export PJ_SOURCE="$GITHUB_WORKSPACE/product"
          export PJ_WITNESS_INPUTS="$RUNNER_TEMP/pj-inputs"
          python3 -B witness/.github/witness/boot412-gateway-trade.py --evidence "$RUNNER_TEMP/pj-gateway"
      - name: Verify durable payment to inventory recovery
        run: |
          export PJ_SOURCE="$GITHUB_WORKSPACE/product"
          export PJ_WITNESS_INPUTS="$RUNNER_TEMP/pj-inputs"
          python3 -B witness/.github/witness/boot412-payment-inventory.py --evidence "$RUNNER_TEMP/pj-payment"
      - name: Record limited runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plainjournal-boot412-linux-runtime-0c4fd7c
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pj-inputs/toolchain.txt
            ${{ runner.temp }}/pj-inputs/*.json
            ${{ runner.temp }}/pj-inputs/*-image-id.txt
            ${{ runner.temp }}/pj-gateway/host-*.json
            ${{ runner.temp }}/pj-gateway/inputs.json
            ${{ runner.temp }}/pj-gateway/nacos-config-readback.json
            ${{ runner.temp }}/pj-gateway/result.json
            ${{ runner.temp }}/pj-gateway/runtime.json
            ${{ runner.temp }}/pj-gateway/cleanup.json
            ${{ runner.temp }}/pj-payment/host-*.json
            ${{ runner.temp }}/pj-payment/coordinates.json
            ${{ runner.temp }}/pj-payment/*-artifact.json
            ${{ runner.temp }}/pj-payment/result.json
            ${{ runner.temp }}/pj-payment/cleanup.json
            ${{ runner.temp }}/pj-payment/payment-published.json
            ${{ runner.temp }}/pj-payment/inventory-offline-pending.json
            ${{ runner.temp }}/pj-payment/confirmed-ledgers.json
            ${{ runner.temp }}/pj-payment/recovery-timeout-ledgers.json
            ${{ runner.temp }}/pj-payment/mysql-version.json
