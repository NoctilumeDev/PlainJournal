name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
      - name: Verify generated documents and architecture
        run: |
          node tools/run-repository-tests.mjs
          node tools/check-backend-boundaries.mjs
          node tools/check-visual-docs.mjs
          node tools/check-documentation-structure.mjs
          node tools/check-markdown-links.mjs
          node tools/check-release-version.mjs
          node tools/render-verification-summary.mjs --check
      - name: Parse Compose configurations
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          pwsh -NoLogo -NoProfile -File deploy/docker/bootstrap-resources.ps1 -PrepareEnvironmentOnly
          docker compose --file deploy/docker/compose.yml --env-file deploy/docker/.env --profile core config --quiet
          docker compose --file frontend/deploy/nginx/compose.yml config --quiet
      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" \
              && "${{ github.ref_type }}" == "branch" \
              && -n "$PUSH_BEFORE_SHA" \
              && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA...$PUSH_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Enforce aggregate backend coverage
        run: node tools/check-backend-coverage.mjs
      - name: Run PMD
        working-directory: backend
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -DskipTests install
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run frontend gates
        working-directory: frontend
        run: pnpm check
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/.run/*.log
          if-no-files-found: ignore
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
