name: 可复现性或文档问题
description: 报告启动说明、验证脚本、文档链接或平台兼容问题
title: "[Docs/Repro] "
labels: [documentation, reproducibility]
body:
  - type: textarea
    id: entry
    attributes:
      label: 使用的入口
      description: 写明文档路径和执行命令。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 当前结果
      description: 写明失败位置和完整的非敏感错误信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统和相关工具版本。
    validations:
      required: true
