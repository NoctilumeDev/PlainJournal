name: 缺陷报告
description: 报告可稳定复现的业务、接口、构建或运行问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题不包含密码、Token、Cookie、真实订单或其他敏感信息。
  - type: textarea
    id: version
    attributes:
      label: 版本或 Commit
      description: 填写 Release 标签、Commit SHA 或分支名称。
      placeholder: v1.0.2 / 0123456789abcdef
    validations:
      required: true
  - type: dropdown
    id: verification_tier
    attributes:
      label: 使用的验证档位
      options:
        - UI Demo
        - Core Smoke
        - Full Lab
        - 普通开发环境
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 说明实际行为与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 提供从干净状态开始的命令、请求或页面操作。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 影响范围
      options:
        - Backend
        - Storefront
        - Admin
        - Infrastructure
        - Documentation
        - Release automation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、JDK、Node、pnpm、浏览器和中间件版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 非敏感证据
      description: 可附脱敏日志、状态码、trace_id 或截图。
  - type: checkboxes
    id: sanitization
    attributes:
      label: 脱敏确认
      options:
        - label: 我已确认内容不包含密码、Token、Cookie、真实订单或个人信息。
          required: true
