version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      spring-platform:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
          - "com.alibaba.cloud:*"
        update-types: [minor, patch]
      backend-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
          - "com.alibaba.cloud:*"
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      frontend-production:
        dependency-type: production
        update-types: [minor, patch]
      frontend-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
